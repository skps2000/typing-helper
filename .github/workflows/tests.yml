name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime deps
        run: python -m pip install pynput pyperclip pystray Pillow comtypes rapidfuzz platformdirs sv-ttk
      - name: Run core tests
        run: python tests/test_core.py
