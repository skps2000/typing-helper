name: Release build

# Build the Windows exe and attach it to the GitHub Release when a version tag is pushed.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONUTF8: '1'
        run: python tests/test_core.py

      - name: Build exe
        run: >
          python -m PyInstaller --onefile --noconsole
          --collect-all tkinter --collect-all comtypes --collect-all rapidfuzz
          --collect-all sv_ttk --collect-all customtkinter --collect-all darkdetect
          --hidden-import platformdirs --collect-submodules platformdirs
          --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32
          --hidden-import pystray._win32 --hidden-import comtypes.stream
          --name TypingHelper --noconfirm typing_helper.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TypingHelper-exe
          path: dist/TypingHelper.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TypingHelper.exe
